name: Complete
on:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1
            - name: Setup Node.js environment
              uses: actions/setup-node@v7.1.0
            - name: "install dependencies"
              run: npm install 
            - name: test
              run: npm test
            - name: "bundle into zip"
              run: |
                zip -r app.zip . \
                -x ".git/*" \
                -x ".github/*" \
                -x "*.zip"
            - name: verification
              run: ls -alhR
